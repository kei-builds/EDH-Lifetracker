# Publishes the life-tracker folder to GitHub Pages on every push to main.
# Turn it on once: repository Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp service worker cache version
        run: sed -i "s/const VERSION = '[^']*'/const VERSION = 'edh-life-${GITHUB_SHA:0:7}'/" life-tracker/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: life-tracker
      - id: deployment
        uses: actions/deploy-pages@v4
